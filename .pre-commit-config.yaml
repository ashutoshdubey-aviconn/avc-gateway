# Pre-commit hooks: formatters and linters
# Exclude provisioning scripts from automated hooks
exclude: '(^ProvisioningScriptSaving\.py$|^ProvisioningScriptWHTM\.py$)'
repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=120]
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        files: '\.py$'
        args: ['--profile', 'black']
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--exclude=wareApp/migrations"
        files: '^(?!wareApp/migrations/).+\\.py$'
  

version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: warehouse_integration
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1884:1883"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DB_NAME: warehouse_integration
      DB_USER: warehouse
      DB_PASSWORD: warehouse
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: warehouse.settings_integration
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    tty: true

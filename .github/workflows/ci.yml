name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: aviconn
          POSTGRES_PASSWORD: whpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aviconn -d warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U aviconn && break
            sleep 1
          done

      - name: Run black/isort checks
        run: |
          black --check .
          isort --check-only .

      - name: Run migrations and tests
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'True'
          DB_NAME: warehouse
          DB_USER: aviconn
          DB_PASSWORD: whpass
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DJANGO_SETTINGS_MODULE: warehouse.settings
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2
name: CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint & format (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files || true

      - name: Run Django system checks
        env:
          DJANGO_SETTINGS_MODULE: warehouse.settings_test
        run: |
          python manage.py check

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: warehouse.settings_test
        run: |
          python manage.py test --verbosity=2

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: warehouse_integration
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready -U warehouse --health-interval 10s --health-timeout 5s --health-retries 5
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports: ['1883:1883']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in `seq 1 30`; do
            pg_isready -h localhost -p 5432 -U warehouse && break || sleep 1
          done

      - name: Run integration tests
        env:
          DJANGO_SETTINGS_MODULE: warehouse.settings_integration
          DB_NAME: warehouse_integration
          DB_USER: warehouse
          DB_PASSWORD: warehouse
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2
